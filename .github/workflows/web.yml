# Her main'e gönderimde oyunu tarayıcı için derler ve GitHub Pages'e yayınlar.
name: Derleme (Web + Windows + Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot ve dışa aktarma şablonlarını indir
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates/* "$tdir/"
          rm -rf templates *.zip *.tpz

      - name: Varlıkları içe aktar
        run: ./godot --headless --import || true

      - name: Web için dışa aktar
        run: |
          mkdir -p build/web
          ./godot --headless --export-release "Web" build/web/index.html
          ls -la build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  windows:
    # Windows .exe ve Android .apk aynı işte derlenir; ikisi de "son-surum" sayfasına yüklenir
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Godot ve dışa aktarma şablonlarını indir
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates/* "$tdir/"
          rm -rf templates *.zip *.tpz

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # imza anahtarı önbellekte saklanır: her sürüm aynı anahtarla imzalanır, telefonda güncelleme
      # kaldırmadan üstüne kurulur (önbellek 7 gün kullanılmazsa silinir; o zaman bir kez kaldırıp kurmak gerekir)
      - name: İmza anahtarını önbellekten al
        uses: actions/cache@v4
        with:
          path: android-key
          key: android-debug-keystore-v1

      - name: Android ayarları
        run: |
          mkdir -p android-key
          if [ ! -f android-key/debug.keystore ]; then
            keytool -genkeypair -keystore android-key/debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Beyond The Eye, O=Bogac, C=TR"
          fi
          cfg="$HOME/.config/godot"
          mkdir -p "$cfg"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' \
            "$ANDROID_SDK_ROOT" "$JAVA_HOME" "$PWD/android-key/debug.keystore" > "$cfg/editor_settings-4.7.tres"
          cp "$cfg/editor_settings-4.7.tres" "$cfg/editor_settings-4.tres"
          # her derlemede sürüm numarası artar (telefon yeni sürümü güncelleme olarak tanır)
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg

      - name: Varlıkları içe aktar
        run: ./godot --headless --import || true

      - name: Windows için dışa aktar
        run: |
          mkdir -p build/windows
          ./godot --headless --export-release "Windows" build/windows/BeyondTheEye.exe
          cp README.md build/windows/BENIOKU.md
          cd build && zip -r -q ../BeyondTheEye-Windows.zip windows

      - name: Android için dışa aktar
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/android-key/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          ./godot --headless --export-debug "Android" build/android/BeyondTheEye.apk 2>&1 | tail -40
          ls -la build/android
          cp build/android/BeyondTheEye.apk BeyondTheEye.apk

      - name: Son Sürüm sayfasına yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son-surum -y --cleanup-tag || true
          gh release create son-surum BeyondTheEye-Windows.zip BeyondTheEye.apk \
            --title "Beyond The Eye · Son Sürüm (Windows + Android)" \
            --notes "Windows: zip'i aç, BeyondTheEye.exe'ye çift tıkla ('bilinmeyen yayıncı' uyarısında: Ek bilgi → Yine de çalıştır). Android: APK'yı telefona indir, aç, 'bilinmeyen kaynaklardan yüklemeye' izin ver. Kontrolcü desteklenir. Derleme: ${GITHUB_SHA::7}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # itch.io: itch uygulamasıyla kurulan oyunlara Windows "bilinmeyen yayıncı" uyarısı çıkmaz.
      # BUTLER_API_KEY gizli anahtarı eklenmemişse bu adım atlanır.
      - name: itch.io'ya yükle
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "BUTLER_API_KEY yok, itch.io atlandı"; exit 0; fi
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler push build/windows bogacavdar/beyond-the-eye:windows --userversion "${GITHUB_RUN_NUMBER}"
          ./butler/butler push BeyondTheEye.apk bogacavdar/beyond-the-eye:android --userversion "${GITHUB_RUN_NUMBER}"
